<div class="auth-popup">
    <div class="auth-container auth-login-container">
        <div class="auth-option">
            <div class="login-option-container">
                <span class="login-option">Login</span>
            </div>
            <div class="signup-option-container">
                <span class="signup-option">Signup</span>
            </div>
        </div>
        <span class="auth-text auth-flex">Login</span>
        <div class="auth-email-container auth-flex">
            <input class="auth-email-signin" id="input" type="text" placeholder="Email">
        </div>
        <div class="auth-password-container auth-flex">
            <input class="auth-password-signin" id="input" type="text" placeholder="Password">
        </div>
        <div class="auth-confirm-button auth-login-account auth-flex">
            <span>Confirm</span>
        </div>
        <div class="auth-error auth-flex">
            <span class="auth-login-error-message"></span>
        </div>
    </div>
    <div class="auth-container auth-signup-container">
        <div class="auth-option">
            <div class="login-option-container">
                <span class="login-option">Login</span>
            </div>
            <div class="signup-option-container">
                <span class="signup-option">Signup</span>
            </div>
        </div>
        <span class="auth-text auth-flex">Create an account</span>
        <div class="auth-email-container auth-flex">
            <input class="auth-email-signup" id="input" name="input" type="text" placeholder="Email">
        </div>
        <div class="auth-password-container auth-flex">
            <input class="auth-password-signup" id="input" type="text" placeholder="Password">
        </div>
        <div class="auth-confirm-button auth-create-account auth-flex">
            <span>Confirm</span>
        </div>
        <div class="auth-error auth-flex">
            <span class="auth-signup-error-message"></span>
        </div>
    </div>
</div>
