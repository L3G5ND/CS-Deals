<div class='item-card'>
    <div class="item-card-price-container">
        <span class="item-card-price"></span>
        <span class="item-card-deal"></span>    
    </div>
    <div class="item-card-image-container">
        <img class="item-card-image" src="">
    </div>
    <div class="item-card-float-container">
        <span class="item-card-float-abbreviation"></span>
        <span class="item-card-float"></span>
        <div class="item-card-float-bar">
            <div class="item-card-float-bar-fn"></div>
            <div class="item-card-float-bar-mw"></div>
            <div class="item-card-float-bar-ft"></div>
            <div class="item-card-float-bar-ww"></div>
            <div class="item-card-float-bar-bs"></div>
            <div class="item-card-float-bar-cover"></div>
        </div>
    </div>
    <div class="item-card-name-container">
        <span class="item-card-name"></span>
        <span class="item-card-type"></span>
        <img class="item-card-copy-name-to-clipboard" src="../images/copy-to-clipboard.png"></img>
    </div>
    <div class="item-card-market-price-container">
        <div class="item-card-market-price-info-container">
            <a class="item-card-buff-link" href="">
                <img class="item-card-market-icon" src="../images/steam-icon.png">
            </a>
            <span class="item-card-market-price item-card-buff-price"></span>
        </div>
        <div class="item-card-market-price-info-container">
            <a class="item-card-steam-link" href="">
                <img class="item-card-market-icon" src="../images/steam-icon.png">
            </a>
            <span class="item-card-market-price item-card-steam-price"></span>
        </div>
        <div class="item-card-market-price-info-container">
            <a class="item-card-price-empire-link" href="">
                <img class="item-card-market-icon" src="../images/price-empire-icon.ico">
            </a>
            <span class="item-card-market-price item-card-price-empire-price"></span>
        </div>
    </div>
    <div class='item-card-footer'>
        <span class="item-card-buy-button">Buy</span>
    </div>
</div>
